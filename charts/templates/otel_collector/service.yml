---
{{- if .Values.otel_collector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.otel_collector.name_prefix }}-svc
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ .Values.otel_collector.name_prefix }}
  ports:
    - protocol: TCP
      port: 4317
      targetPort: 4317
{{- end }}
