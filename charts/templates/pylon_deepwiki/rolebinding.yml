---

{{- if and (.Values.pylon_deepwiki.enabled) (.Values.pylon_deepwiki.jobs.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_deepwiki.name_prefix }}-job-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: deepwiki-job-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.pylon_deepwiki.name_prefix }}-job-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
