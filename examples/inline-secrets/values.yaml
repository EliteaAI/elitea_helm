# All credentials live in this file (no Secret created by you, no auto-generation).
# Simple, but: the values end up in the Helm release Secret and in git if you commit this file.
# Use only for tests/dev, or keep the real file out of git (git-crypt, SOPS: `helm secrets`).
# For production use common.existingSecret (see ../aws, ../gcp, ../azure).
#
#   openssl rand 40 | base64 | tr '/+' '_-'                       # most keys
#   openssl rand 32 | openssl base64 -A | tr '+/' '-_'            # secrets_master_key (Fernet)
#   helm install elitea ./charts -n elitea --create-namespace -f examples/inline-secrets/values.yaml
hmac_auto_generate: false             # keys below are used as they are

common:
  config:
    app_host: localhost
  secrets:
    postgres_user: elitea
    postgres_password: CHANGE_ME
    redis_password: CHANGE_ME

    hmacs:
      rpc_hmac_key: CHANGE_ME
      event_hmac_key: CHANGE_ME
      exposure_hmac_key: CHANGE_ME
      indexer_hmac_key: CHANGE_ME
      mesh_hmac_key: CHANGE_ME

    # never change these after the first install
    auth:
      application_auth_secret_key: CHANGE_ME
      default_admin_password: CHANGE_ME
    main:
      application_main_secret_key: CHANGE_ME
      secrets_master_key: CHANGE_ME     # Fernet key

# StorageClass of your cluster (kubectl get sc); the chart default is GKE's premium-rwo
pylon_main:
  storage: {class: standard}
pylon_auth:
  storage: {class: standard}
pylon_indexer:
  storage: {class: standard}
postgresql:
  persistence: {storageClass: standard}
redis:
  persistence: {storageClass: standard}
