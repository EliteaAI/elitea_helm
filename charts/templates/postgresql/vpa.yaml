---
{{- if and (.Values.postgresql.resources.vpa_enabled) (.Values.embedded_services_pgsql) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.postgresql.name_prefix }}-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.postgresql.name_prefix }}
  updatePolicy:
    updateMode: {{ .Values.postgresql.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        minAllowed:
          cpu: "3"
          memory: "16Gi"
        maxAllowed:
          cpu: "6"
          memory: "32Gi"
        controlledResources:
          - cpu
          - memory
{{- end }}
