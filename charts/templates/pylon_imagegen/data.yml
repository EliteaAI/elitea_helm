---
{{- if .Values.pylon_imagegen.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_imagegen.name_prefix }}-data
  namespace: {{ .Release.Namespace }}

data:
{{- $files := .Files.Glob "data/configs/pylon_imagegen/*.yml" -}}
{{- if $files }}
{{ $files.AsConfig | nindent 2 }}
{{- end }}
  pylon.yml: |
{{ tpl (.Files.Get "data/configs/pylon_imagegen/pylon.yml.tpl") . | nindent 4 }}
  bootstrap.yml: |
{{ tpl (.Files.Get "data/configs/pylon_imagegen/bootstrap.yml.tpl") . | nindent 4 }}
  imagegen.yml: |
{{ tpl (.Files.Get "data/configs/pylon_imagegen/imagegen.yml.tpl") . | nindent 4 }}
{{- end }}
