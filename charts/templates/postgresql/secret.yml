{{- if not .Values.common.existingSecret }}
{{- $embedded_pgsql := (.Values.embedded_services_pgsql | default false) -}}
{{- if $embedded_pgsql }}
{{- $pwd := include "elitea.postgresPassword" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.postgresql.name_prefix }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  postgres_user: {{ .Values.common.secrets.postgres_user | default "elitea" | b64enc | quote }}
  postgres_password: {{ $pwd | b64enc | quote }}
  postgres_db: {{ .Values.common.config.postgres_db | default "eliteadb" | b64enc | quote }}
{{- end }}
{{- end }}
