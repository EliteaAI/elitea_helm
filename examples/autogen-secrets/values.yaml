---
# The chart generates the HMAC keys, the application / master encryption keys and the embedded PostgreSQL / Redis
# passwords for you. They are created on the first install and reused on every `helm upgrade` (read back from the
# cluster with `lookup`). You only provide the admin password, on the command line, so it never sits in a file:
#
#   helm install elitea ./charts -n elitea --create-namespace -f examples/autogen-secrets/values.yaml \
#     --set common.secrets.auth.default_admin_password="<admin password>"
#
# Limits: needs cluster access, so NOT for `helm template`, Argo CD or Flux (use existingSecret there);
# deleting the generated Secrets or the namespace generates new keys.

common:
  config:
    github_auth: false  # true: set secrets.github_token below
    app_host: localhost
  secrets:
    hmac_auto_generate: true
    postgres_password: ""             # empty = generated (embedded PostgreSQL)
    redis_password: ""                # empty = generated (embedded Redis)
    github_user: ""
    github_token: ""                  # needed only when config.github_auth: true
    hmacs:
      rpc_hmac_key: ""
      event_hmac_key: ""
      exposure_hmac_key: ""
      indexer_hmac_key: ""
      mesh_hmac_key: ""
    auth:
      application_auth_secret_key: ""   # empty = generated
    main:
      application_main_secret_key: ""   # empty = generated
      secrets_master_key: ""            # empty = generated (Fernet)

# StorageClass of your cluster (kubectl get sc); the chart default is GKE's premium-rwo
pylon_main:
  storage: {class: standard}
pylon_auth:
  storage: {class: standard}
pylon_indexer:
  storage: {class: standard}
postgresql:
  persistence: {storageClass: standard}
redis:
  persistence: {storageClass: standard}
