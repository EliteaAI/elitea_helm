---
{{- if .Values.otel_collector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.otel_collector.name_prefix }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  {{- if .Values.otel_collector.gsa }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.otel_collector.gsa | quote }}
  {{- end }}
{{- end }}
