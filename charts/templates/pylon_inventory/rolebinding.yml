---

{{- if and (.Values.pylon_inventory.enabled) (.Values.pylon_inventory.jobs.enabled) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.pylon_inventory.name_prefix }}-job-manager
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: inventory-job-manager
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: Role
  name: {{ .Values.pylon_inventory.name_prefix }}-job-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
