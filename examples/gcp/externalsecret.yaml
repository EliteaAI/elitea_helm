---
# Prerequisites: External Secrets Operator installed; Workload Identity: the Kubernetes service account
# `external-secrets-sa` is bound to a Google SA with roles/secretmanager.secretAccessor.
# Create ONE secret per key in Secret Manager (names below), or one JSON secret (see the commented variant).
#   printf '%s' "$(openssl rand 64 | base64 -w0 | tr '/+' '_-')" | gcloud secrets create elitea-rpc-hmac-key --data-file=-
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: elitea-store
  namespace: elitea
spec:
  provider:
    gcpsm:
      projectID: my-project
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: my-cluster
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elitea-secrets
  namespace: elitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: elitea-store
    kind: SecretStore
  target:
    name: elitea-secrets          # = common.existingSecret
    creationPolicy: Owner
  # One JSON secret (see ../secret-keys.json):
  dataFrom:
    - extract:
        key: elitea-prod
  # Or one secret per key:
  # data:
  #   - {secretKey: rpc_hmac_key, remoteRef: {key: elitea-rpc-hmac-key}}
  #   - {secretKey: postgres_password, remoteRef: {key: elitea-postgres-password}}
  #   - {secretKey: github_token, remoteRef: {key: elitea-github-token}}  # only when github_auth: true
  #   - {secretKey: github_user, remoteRef: {key: elitea-github-user}}  # only when github_auth: true
