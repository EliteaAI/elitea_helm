---
{{- if and (.Values.redis.resources.vpa_enabled) (.Values.embedded_services_redis) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.redis.name_prefix }}-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.redis.name_prefix }}
  updatePolicy:
    updateMode: {{ .Values.redis.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: redis
        minAllowed:
          cpu: "200m"
          memory: "128Mi"
        maxAllowed:
          cpu: "4"
          memory: "6Gi"
        controlledResources:
          - cpu
          - memory
{{- end }}
