
---
{{- if and (.Values.otel_collector.enabled) (.Values.otel_collector.resources.vpa_enabled) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.otel_collector.name_prefix }}-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.otel_collector.name_prefix }}
  updatePolicy:
    updateMode: {{ .Values.otel_collector.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Values.otel_collector.name_prefix }}
        minAllowed:
          cpu: "100m"
          memory: "128Mi"
        maxAllowed:
          cpu: "2"
          memory: "512Mi"
        controlledResources:
          - cpu
          - memory
{{- end }}
