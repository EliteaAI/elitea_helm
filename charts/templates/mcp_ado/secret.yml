---
{{- if .Values.mcp_ado.enabled }}
{{- $mcp := .Values.mcp_ado }}
{{- $multipleApiKeysEnabled := $mcp.ado.multiple_api_keys.enabled }}
{{- $legacyApiKeyEnabled := and $mcp.ado.legacy_api_key_enabled (not $multipleApiKeysEnabled) }}
{{- if not (or $mcp.ado.legacy_api_key_enabled $mcp.ado.multiple_api_keys.enabled) }}
{{- fail "at least one of mcp_ado.ado.legacy_api_key_enabled or mcp_ado.ado.multiple_api_keys.enabled must be true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ $mcp.name_prefix }}-secret
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  personal_access_token: {{ required "mcp_ado.ado.personal_access_token is required when mcp_ado is enabled" $mcp.ado.personal_access_token | quote }}
  {{- if $legacyApiKeyEnabled }}
  mcp_api_key: {{ required "mcp_ado.ado.mcp_api_key is required when legacy API key is enabled" $mcp.ado.mcp_api_key | quote }}
  {{- end }}
  {{- if $multipleApiKeysEnabled }}
  {{- if not $mcp.ado.multiple_api_keys.values }}
  {{- fail "mcp_ado.ado.multiple_api_keys.values is required when multiple API keys are enabled" }}
  {{- end }}
  mcp_api_keys: {{ toJson $mcp.ado.multiple_api_keys.values | quote }}
  {{- end }}
{{- end }}
