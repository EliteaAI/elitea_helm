{{- $pm  := .Values.pylon_main -}}

---
{{- if .Values.pylon_main.resources.vpa_enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $pm.name_prefix }}-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $pm.name_prefix }}
  updatePolicy:
    updateMode: {{ .Values.pylon_main.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $pm.name_prefix }}
        minAllowed:
          cpu: "1"
          memory: "1Gi"
        maxAllowed:
          cpu: "4"
          memory: "4Gi"
        controlledResources:
          - cpu
          - memory
{{- end }}
