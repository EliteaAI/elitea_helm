{{- if not (include "elitea.existingSecret" .) }}
---
{{- $embedded_redis := (.Values.embedded_services_redis | default false)  -}}
{{- if $embedded_redis }}
{{- $secretName := printf "%s-secret" .Values.redis.name_prefix -}}
{{- $ns := .Release.Namespace -}}
{{- $pwd := include "elitea.redisPassword" . }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ $secretName }}
  namespace: {{ $ns }}
type: Opaque
data:
  redis_password: {{ $pwd | b64enc | quote }}
{{- end }}
{{- end }}
