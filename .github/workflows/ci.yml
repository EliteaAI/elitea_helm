---
name: CI

on:
  # yamllint disable-line
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

# Runner: repository variable RUNNER_LABELS, e.g. ["self-hosted","linux","x64"]; GitHub-hosted if unset.
# The self-hosted image has curl, git, jq, trivy, grype but no helm: it is installed by setup-helm below.
# Fork PRs run on GitHub-hosted runners only (untrusted code must not reach the self-hosted one),
# so the required checks still run for them. Missing tools (trivy) are installed on the fly.
jobs:
  lint:
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (install if missing)
        run: |
          command -v trivy >/dev/null || {
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v0.76.1
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          }

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Lint (strict, dummy secrets)
        run: helm lint charts --strict -f charts/ci/test-values.yaml

      - name: Render defaults and every example
        run: |
          set -euo pipefail
          mkdir -p build
          helm template elitea charts -n elitea -f charts/ci/test-values.yaml > build/default.yaml
          for f in examples/*/values.yaml; do
            name=$(basename "$(dirname "$f")")
            extra=()
            # examples without existingSecret need the 4 encryption keys
            grep -q '^  existingSecret:' "$f" || extra=(-f charts/ci/test-values.yaml)
            helm template elitea charts -n elitea "${extra[@]}" -f "$f" > "build/$name.yaml"
            echo "rendered $f"
          done

      - name: Render with every optional component and each cloud load balancer
        run: |
          set -euo pipefail
          for cloud in gcp aws azure; do
            helm template elitea charts -n elitea -f charts/ci/test-values.yaml \
              --set ingress_enabled=true --set cloud_ingress_type=$cloud \
              --set pylon_imagegen.enabled=true --set pylon_deepwiki.enabled=true \
              --set pylon_inventory.enabled=true --set otel_collector.enabled=true \
              --set common.elitea_repo_type=internal \
              --set external_ca_enabled=true --set external_ca_configmap=cas --set 'external_ca_files={ca.crt}' \
              > "build/full-$cloud.yaml"
          done

      - name: Validate manifests (kubeconform)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 build/*.yaml

      - name: Trivy misconfiguration scan
        run: trivy config build --ignorefile .trivyignore.yaml --severity MEDIUM,HIGH,CRITICAL --exit-code 1

      - name: Required secrets are enforced
        run: |
          if helm template elitea charts >/dev/null 2>&1; then
            echo "chart rendered without required secrets"; exit 1
          fi

  secret-scan:
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (install if missing)
        run: |
          command -v trivy >/dev/null || {
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" v0.76.1
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          }

      - name: Trivy secret scan
        run: trivy fs --scanners secret --exit-code 1 .

  commits:
    if: github.event_name == 'pull_request'
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # uv is preinstalled on the runner (no python venv/pip there)
      - name: Conventional commits
        run: |
          uvx --from commitizen cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

      # with squash merge the PR title becomes the commit on main (and feeds CHANGELOG / version bump)
      - name: PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: 'uvx --from commitizen cz check --message "$PR_TITLE"'
