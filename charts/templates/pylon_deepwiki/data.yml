---
{{- if .Values.pylon_deepwiki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_deepwiki.name_prefix }}-data
  namespace: {{ .Release.Namespace }}
data:
{{- $files := .Files.Glob "data/configs/pylon_deepwiki/*.yml" -}}
{{- if $files }}
{{ $files.AsConfig | nindent 2 }}
{{- end }}
  pylon.yml: |
{{ tpl (.Files.Get "data/configs/pylon_deepwiki/pylon.yml.tpl") . | nindent 4 }}
  bootstrap.yml: |
{{ tpl (.Files.Get "data/configs/pylon_deepwiki/bootstrap.yml.tpl") . | nindent 4 }}
  deepwiki_plugin.yml: |
{{ tpl (.Files.Get "data/configs/pylon_deepwiki/deepwiki_plugin.yml.tpl") . | nindent 4 }}
{{- end }}
