---
{{- if and .Values.internal_repo.resources.vpa_enabled (eq .Values.common.elitea_repo_type "internal") }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: internal-repo-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: internal-repo
  updatePolicy:
    updateMode: {{ .Values.internal_repo.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: internal-repo
        minAllowed:
          cpu: "200m"
          memory: "256Mi"
        maxAllowed:
          cpu: "4"
          memory: "4Gi"
        controlledResources:
          - cpu
          - memory
{{- end }}
