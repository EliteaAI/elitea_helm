
---
{{- if .Values.mcp_grafana.enabled }}
apiVersion: v1
kind: Secret

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.mcp_grafana.name_prefix }}-secret
  namespace: {{ .Release.Namespace }}

stringData:
  token_secret_key: {{ .Values.mcp_grafana.grafana.token_secret_key | quote }}
{{- end }}
