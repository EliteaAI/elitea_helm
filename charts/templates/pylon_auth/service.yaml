---
apiVersion: v1
kind: Service

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_auth.name_prefix }}-svc
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    name: {{ .Values.pylon_auth.name_prefix }}

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    {{- if .Values.pylons_mesh_enabled }}
    - name: zmq-sub
      protocol: TCP
      port: 5010
      targetPort: 5010
    - name: zmq-push
      protocol: TCP
      port: 5011
      targetPort: 5011
    {{- end }}
