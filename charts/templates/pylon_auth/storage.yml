---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_auth.name_prefix }}-storage
  namespace: {{ .Release.Namespace }}

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.pylon_auth.storage.class }}

  resources:
    requests:
      storage: "{{ .Values.pylon_auth.storage.size }}"
