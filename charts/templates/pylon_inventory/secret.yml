{{- if not (include "elitea.existingSecret" .) }}
{{- if .Values.pylon_inventory.enabled }}
{{- if .Values.embedded_services_pgsql }}{{ $_ := include "elitea.postgresPassword" . }}{{ end -}}
{{- if .Values.embedded_services_redis }}{{ $_ := include "elitea.redisPassword" . }}{{ end -}}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_inventory.name_prefix }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- include "elitea.commonSecrets" . | nindent 2 }}
{{- end }}
{{- end }}
