---
{{- if .Values.mcp_grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mcp_grafana.name_prefix }}-svc
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    name: {{ .Values.mcp_grafana.name_prefix }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.mcp_grafana.service.port }}
      targetPort: http
{{- end }}
