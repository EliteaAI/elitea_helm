# Prerequisites: External Secrets Operator installed; Workload Identity: service account `external-secrets-sa`
# is annotated with azure.workload.identity/client-id and the identity has "Key Vault Secrets User" on the vault.
# Key Vault secret names allow only letters, digits and dashes: store one secret per key (names below)
# or one JSON secret (see ../secret-keys.json) and use `extract` as in the commented variant.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: elitea-store
  namespace: elitea
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://my-vault.vault.azure.net
      serviceAccountRef:
        name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elitea-secrets
  namespace: elitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: elitea-store
    kind: SecretStore
  target:
    name: elitea-secrets          # = common.existingSecret
    creationPolicy: Owner
  data:
    - {secretKey: postgres_user,                remoteRef: {key: elitea-postgres-user}}
    - {secretKey: postgres_password,            remoteRef: {key: elitea-postgres-password}}
    - {secretKey: redis_password,               remoteRef: {key: elitea-redis-password}}
    - {secretKey: rpc_hmac_key,                 remoteRef: {key: elitea-rpc-hmac-key}}
    - {secretKey: event_hmac_key,               remoteRef: {key: elitea-event-hmac-key}}
    - {secretKey: exposure_hmac_key,            remoteRef: {key: elitea-exposure-hmac-key}}
    - {secretKey: indexer_hmac_key,             remoteRef: {key: elitea-indexer-hmac-key}}
    - {secretKey: mesh_hmac_key,                remoteRef: {key: elitea-mesh-hmac-key}}
    - {secretKey: application_auth_secret_key,  remoteRef: {key: elitea-application-auth-secret-key}}
    - {secretKey: default_admin_password,       remoteRef: {key: elitea-default-admin-password}}
    - {secretKey: application_main_secret_key,  remoteRef: {key: elitea-application-main-secret-key}}
    - {secretKey: secrets_master_key,           remoteRef: {key: elitea-secrets-master-key}}
  # Or one JSON secret:
  # dataFrom:
  #   - extract:
  #       key: elitea-prod
