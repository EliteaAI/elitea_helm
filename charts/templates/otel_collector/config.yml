---
{{- if .Values.otel_collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otel_collector.name_prefix }}-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
data:
  {{- $files := .Files.Glob "data/configs/otel_collector/*" }}
  {{- range $path, $_ := $files }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
