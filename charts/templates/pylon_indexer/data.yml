---
apiVersion: v1
kind: ConfigMap

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_indexer.name_prefix }}-data
  namespace: {{ .Release.Namespace }}

data:
{{- $files := .Files.Glob "data/configs/pylon_indexer/*.yml" -}}
{{- if $files }}
{{ $files.AsConfig | nindent 2 }}
{{- end }}
  pylon.yml: |
{{ tpl (.Files.Get "data/configs/pylon_indexer/pylon.yml.tpl") . | nindent 4 }}
  bootstrap.yml: |
{{ tpl (.Files.Get "data/configs/pylon_indexer/bootstrap.yml.tpl") . | nindent 4 }}
  indexer_worker.yml: |
{{ tpl (.Files.Get "data/configs/pylon_indexer/indexer_worker.yml.tpl") . | nindent 4 }}
  tracing.yml: |
{{ tpl (.Files.Get "data/configs/pylon_indexer/tracing.yml.tpl") . | nindent 4 }}
  worker_core.yml: |
{{ tpl (.Files.Get "data/configs/pylon_indexer/worker_core.yml.tpl") . | nindent 4 }}
