---
# All credentials live in this file (no Secret created by you, no auto-generation).
# Simple, but: the values end up in the Helm release Secret and in git if you commit this file.
# Use only for tests/dev, or keep the real file out of git (git-crypt, SOPS: `helm secrets`).
# For production use common.existingSecret (see ../aws, ../gcp, ../azure).
#
#   openssl rand 40 | base64 | tr '/+' '_-'                       # most keys
#   openssl rand 32 | openssl base64 -A | tr '+/' '-_'            # secrets_master_key (Fernet)
#   helm install elitea ./charts -n elitea --create-namespace -f examples/inline-secrets/values.yaml
#--- Ingress ---#
ingress_enabled: true # enable ingress / cloud load balancer
cloud_ingress_type: gcp # gcp (GKE gce) | aws (ALB) | azure (App Gateway AGIC)

ingress:
  annotations: {}  # extra Ingress annotations (e.g. certificate / static IP)
  sticky:
    cookieName: elitea-route
    cookieTtlSeconds: 86400

#--- Embedded PGSLQ/Redis ---#
embedded_services_redis: true
embedded_services_pgsql: true

redis_queue_random_suffix: xEd34
pylons_mesh_enabled: false
autocreate_db: true
tracing_enabled: false
hmac_auto_generate: false

#--- Proxy settings ---#
external_proxy_enabled: false
http_proxy: "proxy.example.com"
https_proxy: "proxy.example.com"
no_proxy: "localhost"

#--- External CA ---#
external_ca_enabled: false
external_ca_configmap: ""
external_ca_files: []

common:
  config:
    app_proto: "https"
    cookies_secure: "true"
    app_host: your-app-hostname.example.com
    ai_project_allowed_domains: "centry.user,example.com"
    sso_provider: form # form | saml | oidc

  secrets:
    postgres_user: elitea
    postgres_password: CHANGE_ME
    redis_password: CHANGE_ME

    hmacs:
      rpc_hmac_key: CHANGE_ME
      event_hmac_key: CHANGE_ME
      exposure_hmac_key: CHANGE_ME
      indexer_hmac_key: CHANGE_ME
      mesh_hmac_key: CHANGE_ME

    # never change these after the first install
    auth:
      application_auth_secret_key: CHANGE_ME
      default_admin_password: CHANGE_ME

    main:
      application_main_secret_key: CHANGE_ME
      secrets_master_key: CHANGE_ME     # Fernet key

#--- Pylons Configs ---#
pylon_auth:
  name_prefix: pylon-auth
  log_level: info

  storage:
    class: "premium-rwo"
    size: "1Gi"

  resources:
    vpa_enabled: false
    mode: "Off" # "Off" | "Auto" | "Initial" | "Recreate" | "InPlace" | "InPlaceOrRecreate"
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

pylon_main:
  name_prefix: pylon-main
  log_level: info

  storage:
    class: "premium-rwo"
    size: "50Gi"
    tmp_size: "20Gi"

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "2"
      memory: "6Gi"
    limits:
      cpu: "2"
      memory: "6Gi"

pylon_indexer:
  name_prefix: pylon-indexer
  log_level: info

  storage:
    class: "premium-rwo"
    size: "200Gi"
    tmp_size: "20Gi"

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "6"
      memory: "20Gi"
    limits:
      cpu: "6"
      memory: "20Gi"

internal_repo:
  resources:
    vpa_enabled: false
    mode: "Off"

    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

redis:
  name_prefix: "redis"
  max_memory: "450mb"
  maxmemory_policy: "allkeys-lru"
  port: 6379

  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: "premium-rwo"

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "1"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

postgresql:
  name_prefix: "pg"
  port: 5432

  persistence:
    size: 250Gi
    accessMode: ReadWriteOnce
    storageClass: "premium-rwo"

  resources:
    vpa_enabled: false
    mode: "Off"

    tmpfs:
      enabled: true
      size: 2Gi

    requests:
      cpu: "4"
      memory: "28Gi"
    limits:
      cpu: "4"
      memory: "28Gi"

pylon_deepwiki:
  enabled: false
  log_level: info
  name_prefix: pylon-deepwiki

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"

  storage:
    class: "premium-rwo"
    size: "50Gi"
    tmp_size: "30Gi"

  configs:
    basePath: /data/wiki_builder
    version: "main"

    # Autoregistration with AI/Run platform (optional)
    aiRunPlatform:
      token: ""         # Bearer token for authentication
      verify: false     # Verify SSL certificates
      timeout: 120      # HTTP timeout (seconds) for registration request
      delay: 15          # Delay (seconds) before registration attempt
      project_id: 1

  jobs:
    enabled: true  # Set to true to enable Jobs-based scaling
    # Maximum concurrent Jobs cluster-wide
    maxConcurrentJobs: 3
    # TTL for completed Jobs (seconds)
    # Jobs are auto-deleted after this time to prevent accumulation
    ttlSecondsAfterFinished: 300

    # Job resource configuration
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"

      limits:
        cpu: "4"
        memory: "8Gi"

pylon_imagegen:
  enabled: false
  log_level: info
  name_prefix: pylon-imagegen

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

  storage:
    class: "premium-rwo"
    size: "50Gi"
    tmp_size: "30Gi"

  configs:

    aiRunPlatform:
      # JWT token for registration (consider using --set at install time to avoid committing)
      token: ""
      # Default bucket for storing generated images (overridable per-request)
      verify: false     # Verify SSL certificates
      timeout: 120      # HTTP timeout (seconds) for registration request
      delay: 15          # Delay (seconds) before registration attempt
      project_id: 1
    imageBucket: "imagelibrary"

pylon_inventory:
  enabled: false
  name_prefix: pylon-inventory
  log_level: info

  resources:
    vpa_enabled: false
    mode: "Off"
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"

  storage:
    class: "premium-rwo"
    size: "50Gi"
    tmp_size: "30Gi"

  configs:
    basePath: /data/inventory
    version: "main"
    aiRunPlatform:
      token: "" #  should be empty
      # Default bucket for storing generated images (overridable per-request)
      verify: false     # Verify SSL certificates
      timeout: 120      # HTTP timeout (seconds) for registration request
      delay: 15          # Delay (seconds) before registration attempt
      project_id: 2

  jobs:
    enabled: true  # Set to true to enable Jobs-based scaling
    # Maximum concurrent Jobs cluster-wide
    maxConcurrentJobs: 3
    # TTL for completed Jobs (seconds)
    # Jobs are auto-deleted after this time to prevent accumulation
    ttlSecondsAfterFinished: 300

    resources:
      requests:
        cpu: "2"
        memory: "2Gi"

      limits:
        cpu: "4"
        memory: "8Gi"
