{{- $pin  := .Values.pylon_inventory -}}

---
{{- if and (.Values.pylon_inventory.resources.vpa_enabled) (.Values.pylon_inventory.enabled) }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ $pin.name_prefix }}-vpa
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $pin.name_prefix }}
  updatePolicy:
    updateMode: {{ .Values.pylon_inventory.resources.mode }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $pin.name_prefix }}
        minAllowed:
          cpu: "200m"
          memory: "1Gi"
        maxAllowed:
          cpu: "4"
          memory: "4Gi"
        controlledResources:
          - cpu
          - memory
{{- end }}
