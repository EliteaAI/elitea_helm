
---
{{- if and .Values.mcp_grafana.enabled (not (include "elitea.existingSecret" .)) }}
apiVersion: v1
kind: Secret

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.mcp_grafana.name_prefix }}-secret
  namespace: {{ .Release.Namespace }}

stringData:
  grafana_service_account_token: {{ .Values.mcp_grafana.grafana.service_account_token | quote }}
{{- end }}
