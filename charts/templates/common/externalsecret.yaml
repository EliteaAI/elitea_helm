{{- if .Values.common.externalSecret.enabled }}
{{- /* One JSON secret in AWS Secrets Manager, GCP Secret Manager or Azure Key Vault; every JSON property becomes a key of the Secret. */ -}}
{{- $es := .Values.common.externalSecret }}
{{- $store := "" }}
{{- if $es.createStore }}{{ $store = $es.storeName | default "elitea-store" }}{{ else }}{{ $store = required "common.externalSecret.storeName is required when createStore is false" $es.storeName }}{{ end }}
{{- if $es.createStore }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $es.provider "gcp" }}
    gcpsm:
      projectID: {{ required "common.externalSecret.gcp.projectID is required" $es.gcp.projectID | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required "common.externalSecret.gcp.clusterLocation is required" $es.gcp.clusterLocation | quote }}
          clusterName: {{ required "common.externalSecret.gcp.clusterName is required" $es.gcp.clusterName | quote }}
          serviceAccountRef:
            name: {{ $es.serviceAccount }}
    {{- else if eq $es.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "common.externalSecret.aws.region is required" $es.aws.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $es.serviceAccount }}
    {{- else if eq $es.provider "azure" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "common.externalSecret.azure.vaultUrl is required" $es.azure.vaultUrl | quote }}
      serviceAccountRef:
        name: {{ $es.serviceAccount }}
    {{- else }}
    {{- fail "common.externalSecret.provider must be gcp, aws or azure" }}
    {{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $store }}
    kind: {{ ternary "SecretStore" $es.storeKind $es.createStore }}
  target:
    name: {{ $es.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "common.externalSecret.key is required" $es.key }}
{{- end }}
