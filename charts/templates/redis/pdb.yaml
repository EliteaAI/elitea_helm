---
{{- if .Values.embedded_services_redis }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.redis.name_prefix }}-pdb
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1  # allows node drain; redis has no replica so brief downtime is expected during maintenance
  selector:
    matchLabels:
      name: {{ .Values.redis.name_prefix }}
{{- end }}
