{{- if .Values.common.externalSecret.enabled }}
{{- /* One JSON secret in AWS Secrets Manager, GCP Secret Manager or Azure Key Vault; every JSON property becomes a key of the Secret. */ -}}
{{- $es := .Values.common.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "elitea.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "common.externalSecret.storeName is required" $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $es.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "common.externalSecret.key is required" $es.key }}
{{- end }}
