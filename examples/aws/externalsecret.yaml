# Prerequisites: External Secrets Operator installed; a service account `external-secrets-sa` in the
# namespace with IRSA role allowing secretsmanager:GetSecretValue on the secret below.
# Create the secret in AWS (JSON, see ../secret-keys.json):
#   aws secretsmanager create-secret --name elitea/prod --secret-string file://secret-keys.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: elitea-store
  namespace: elitea
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elitea-secrets
  namespace: elitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: elitea-store
    kind: SecretStore
  target:
    name: elitea-secrets          # = common.existingSecret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: elitea/prod
