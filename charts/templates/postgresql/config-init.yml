{{- $embedded_pgsql := (.Values.embedded_services_pgsql | default false) -}}
{{- if $embedded_pgsql }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.postgresql.name_prefix }}-init
  namespace: {{ .Release.Namespace }}
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
{{- end }}
