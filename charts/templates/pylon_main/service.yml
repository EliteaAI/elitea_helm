---
apiVersion: v1
kind: Service

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_main.name_prefix }}-svc
  namespace: {{ .Release.Namespace }}
  {{- if and .Values.ingress_enabled (eq .Values.cloud_ingress_type "gcp") }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ .Values.pylon_main.name_prefix }}-backendconfig"}'
  {{- end }}

spec:
  selector:
    name: {{ .Values.pylon_main.name_prefix }}

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
