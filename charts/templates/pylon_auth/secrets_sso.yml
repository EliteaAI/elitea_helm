{{- $sso := (default "form" .Values.common.config.sso_provider | lower) -}}
---
apiVersion: v1
kind: Secret

metadata:
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
  name: {{ .Values.pylon_auth.name_prefix }}-secret-sso
  namespace: {{ .Release.Namespace }}

type: Opaque
stringData:
  auth_oidc.yml: |
{{ tpl (.Files.Get "data/configs/pylon_auth/auth_oidc.yml.tpl") . | nindent 4 }}
{{- if eq $sso "saml" }}
  auth_saml.yml: |
{{ tpl (.Files.Get "data/configs/pylon_auth/auth_saml.yml.tpl") . | nindent 4 }}
{{- end }}
