---
name: Release

# Push a tag equal to the chart version: git tag v2.0.8 && git push origin v2.0.8
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub Release
  packages: write   # ghcr.io

jobs:
  release:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Tag must match Chart.yaml version
        id: ver
        run: |
          version=$(sed -n 's/^version: *//p' charts/Chart.yaml | tr -d '"')
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != chart version v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint charts --strict -f charts/ci/test-values.yaml

      - name: Package
        run: helm package charts -d dist

      - name: Push to ghcr.io (OCI)
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/elitea-${{ steps.ver.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # the self-hosted runner has no gh: use the REST API
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release=$(curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/releases" \
            -d "$(jq -n --arg tag "${GITHUB_REF_NAME}" --arg name "elitea ${VERSION}" \
                  '{tag_name: $tag, name: $name, generate_release_notes: true}')")
          upload_url=$(jq -r '.upload_url | sub("\\{.*"; "")' <<<"${release}")
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/gzip" \
            --data-binary @"dist/elitea-${VERSION}.tgz" "${upload_url}?name=elitea-${VERSION}.tgz" >/dev/null
          echo "released: $(jq -r .html_url <<<"${release}")"
